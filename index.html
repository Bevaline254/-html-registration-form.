<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration form</Form></title>
</head>
<body>
    <h1>Company Registration Form</h1>
    <form  method="post" action="#">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="Fullname">Name:</label>
            <input type="text" id="Fullname" name="Fullname" required><br><br>
            <label for="emailAddress">Email:</label>
            <input type="email" id="emailAddress" name="emailAddress" required><br><br> 
            <label for="phoneNumber">Phone Number:</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required><br><br>
        </fieldset>

        <fieldset>
            <Legend>Company Information</Legend>
            <label for="companyName">Company Name</label>
            <input type="text" id="companyName" name="companyName" required minlength="2">

            <label for="companyWebsite">Company Website</label>
            <input type="url" id="companyWebsite" name="companyWebsite" required>

            <label for="companySize">Company Size (select dropdown)</label>
            <select id="companySize" name="companySize" required>
                <option value="">-- Select Size --</option>
                <option value="1-10">1-10 employees</option>
                <option value="11-50">11-50 employees</option>
                <option value="51-200">51-200 employees</option>
                <option value="201+">201+ employees</option>
            </select>

            <label for="industry">Industry</label>
            <input type="text" id="industry" name="industry" required minlength="3">
        </fieldset>

        <fieldset>
            <legend>3. Service Request</legend>

            <label>Service Type (radio buttons)</label>
            <input type="radio" id="consulting" name="serviceType" value="Consulting" required>
            <label for="consulting">Consulting</label>
            <input type="radio" id="development" name="serviceType" value="Development">
            <label for="development">Development</label>
            <input type="radio" id="support" name="serviceType" value="Support">
            <label for="support">Support</label>

            <label>Preferred Contact Method (checkboxes)</label>
            <input type="checkbox" id="contactEmail" name="contactMethod" value="Email">
            <label for="contactEmail">Email</label>
            <input type="checkbox" id="contactPhone" name="contactMethod" value="Phone">
            <label for="contactPhone">Phone</label>

            <label for="appointmentDate">Appointment Date</label>
            <input type="date" id="appointmentDate" name="appointmentDate" required>

            <label for="appointmentTime">Appointment Time</label>
            <input type="time" id="appointmentTime" name="appointmentTime" required>

            <label for="budgetRange">Budget Range</label>
            <input type="number" id="budgetRange" name="budgetRange" min="1000" max="1000000" required>
        </fieldset>

        <fieldset>
            <legend>4. Message and Agreement</legend>

            <label for="additionalInfo">Additional Information</label>
            <textarea id="additionalInfo" name="additionalInfo" rows="5" minlength="10" required></textarea>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the Terms and Conditions (Required)</label>
        </fieldset>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
        </fieldset>
    </form>
</body>
</html>
